<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบรับแจ้งอุบัติเหตุทางการแพทย์</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script>
    window.addEventListener('message', function (e) {
      if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(e.origin)) return;
      if (e.data && e.data.type === 'sdi-hello' && e.source) {
        e.source.postMessage({ type: 'sdi-ok' }, e.origin);
      }
    });
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f2f8f8; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      gap: .75rem; font: 15px system-ui, 'Noto Sans Thai', Tahoma, sans-serif; color: #115e59;
      background: #f2f8f8; transition: opacity .3s; z-index: 1; }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .spin { width: 22px; height: 22px; border: 3px solid #99f6e4; border-top-color: #0d9488;
      border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><span class="spin"></span>กำลังโหลดระบบ…</div>
  <script>
    (function () {
      var p = [
      'wBXY942bpR3Yh9zYlhXZvoHa',
      '3J1aqNFenVXYOZDMUR0XudWW',
      'xlkbtEHbzoEZKp0Z4BTVxoWN',
      'TZGV0kVUQJXc5YVb4MXUn1UO',
      'CdjdUJnRygzb4J2Y5Z2SB9yc',
      'vM3byNWYt9SbvNmLlx2Zv92Z',
      'uQHcpJ3Yz9yL6MHc0RHa'
      ];
      var f = document.createElement('iframe');
      f.id = 'app-frame';
      f.title = 'ระบบรับแจ้งอุบัติเหตุทางการแพทย์';
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      f.allow = 'clipboard-write';
      f.onload = function () { var l = document.getElementById('loading'); if (l) l.classList.add('hide'); };
      f.src = atob(p.join('').split('').reverse().join(''));
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
